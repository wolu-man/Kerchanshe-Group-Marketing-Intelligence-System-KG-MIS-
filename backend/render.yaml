services:
  - type: web
    name: kg-mis-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: APP_BASE_URL
        value: https://kg-mis-backend.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "8h"
      - key: SESSION_IDLE_MINUTES
        value: "120"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "1433"
      - key: DB_INSTANCE
        sync: false
      - key: DB_NAME
        value: KG_MIS
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_ENCRYPT
        value: "true"
      - key: DB_TRUST_SERVER_CERTIFICATE
        value: "true"
      - key: CORS_ORIGIN
        value: https://your-frontend.vercel.app
      - key: CUAS_MOCK
        value: "true"
      - key: D365FO_MOCK
        value: "true"
      - key: D365FO_SYNC_ENABLED
        value: "false"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: POWERBI_MOCK
        value: "true"
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: AI_PROVIDER
        value: "auto"
      - key: AI_TIMEOUT_MS
        value: "60000"
      - key: OLLAMA_BASE_URL
        value: "http://localhost:11434"
      - key: TENDERS_COLLECTION_CRON
        value: "0 */6 * * *"
      - key: TENDERS_REMINDER_CRON
        value: "0 9 * * *"
      - key: TENDERS_COLLECTION_ENABLED
        value: "false"
      - key: TENDERMETRO_API_KEY
        sync: false